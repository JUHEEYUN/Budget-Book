function openCfg(){
  if(S.needKey) return;
  var c = S.cfg;
  var h = '<h2>설정</h2>'
    + '<label class="f">이름</label>'
    + '<div style="display:flex;gap:8px"><input class="fi" id="c_a" value="'+esc(c.nameA||'아내')+'"><input class="fi" id="c_b" value="'+esc(c.nameB||'남편')+'"></div>'
    + '<label class="f">현대카드 실적 목표</label><input class="fi" id="c_h" type="number" value="'+(c.tgt_hyundai||300000)+'">'
    + '<label class="f">롯데 구독카드 실적 목표</label><input class="fi" id="c_l" type="number" value="'+(c.tgt_lotteA!==undefined?c.tgt_lotteA:300000)+'">'
    + '<label class="f">기본 저축 배분 (비상금 / 적금 / 투자)</label>'
    + '<div style="display:flex;gap:8px">'
    +   '<input class="fi" id="c_e" type="number" value="'+(c.savEmg||400000)+'">'
    +   '<input class="fi" id="c_d" type="number" value="'+(c.savDep||600000)+'">'
    +   '<input class="fi" id="c_i" type="number" value="'+(c.savInv||1000000)+'"></div>'
    + '<label class="f">시작 잔고 (비상금 / 적금 / 투자)</label>'
    + '<div style="display:flex;gap:8px">'
    +   '<input class="fi" id="c_be" type="number" value="'+(c.baseEmg||0)+'">'
    +   '<input class="fi" id="c_bd" type="number" value="'+(c.baseDep||0)+'">'
    +   '<input class="fi" id="c_bi" type="number" value="'+(c.baseInv||0)+'"></div>'
    + '<div class="sub" style="margin-top:5px">앱을 쓰기 시작한 시점의 실제 잔고입니다. 여기에 기록이 더해지고 빠집니다.</div>'
    + '<div class="btns"><button class="btn g" id="c_x">닫기</button><button class="btn p" id="c_ok">저장</button></div>'
    + (GAS ? '<div class="delrow"><button id="c_key">비밀 키 다시 입력</button></div>' : '');
  openSheet(h);
  sheetEl.querySelector('#c_x').onclick = closeSheet;
  var ck = sheetEl.querySelector('#c_key');
  if(ck) ck.onclick = function(){
    confirmSheet('비밀 키 다시 입력', '이 기기에 저장된 비밀 키를 지우고 새로 입력합니다. 시트의 기록은 그대로입니다.', '다시 입력', function(){
      setKey(''); closeSheet(); askKey();
    }, openCfg);
  };
  sheetEl.querySelector('#c_ok').onclick = function(){
    var o = {
      nameA: sheetEl.querySelector('#c_a').value.trim()||'아내',
      nameB: sheetEl.querySelector('#c_b').value.trim()||'남편',
      tgt_hyundai: sheetEl.querySelector('#c_h').value,
      tgt_lotteA: sheetEl.querySelector('#c_l').value,
      savEmg: sheetEl.querySelector('#c_e').value,
      savDep: sheetEl.querySelector('#c_d').value,
      savInv: sheetEl.querySelector('#c_i').value,
      baseEmg: sheetEl.querySelector('#c_be').value,
      baseDep: sheetEl.querySelector('#c_bd').value,
      baseInv: sheetEl.querySelector('#c_bi').value
    };
    for(var k in o) S.cfg[k]=o[k];
    call('saveCfg', o); closeSheet(); render(); toast('저장했습니다');
  };
}

/* ---------- 비밀 키 입력 화면 — 처음 한 번만 ---------- */
function askKey(msg){
  S.needKey = true; S.loading = false;
  document.getElementById('composer').style.display = 'none';
  var v = document.getElementById('view');
  v.innerHTML = '<div class="keybox">'
    + '<div class="empty" style="padding:24px 0 18px"><b>시트 연결</b>Code.gs에 적어둔 비밀 키를 입력해 주세요.<br>이 기기에 저장돼서 다음부터는 묻지 않아요.</div>'
    + (msg ? '<div class="banner">'+esc(msg)+'</div>' : '')
    + '<input class="fi" id="k_in" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="비밀 키">'
    + '<div class="btns"><button class="btn p" id="k_ok">연결</button></div>'
    + '</div>';
  var ki = v.querySelector('#k_in'), kb = v.querySelector('#k_ok');
  function go(){
    var val = ki.value.trim();
    if(!val){ ki.focus(); return; }
    setKey(val);
    kb.disabled = true; kb.textContent = '확인 중…';
    remote('ping').then(function(){
      S.needKey = false;
      load();
    }, function(e){
      if(e && e.message==='key'){ setKey(''); askKey('비밀 키가 맞지 않아요. Code.gs의 API_KEY와 똑같이 입력해 주세요.'); }
      else askKey('연결하지 못했어요. 인터넷 연결과 index.html의 API_URL 주소, Apps Script 배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
    });
  }
  kb.onclick = go;
  ki.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
}

/* ---------- 배분 조정 ---------- */
function editAlloc(){
  var c = S.cfg;
  var v = { e:+(c.savEmg||400000), d:+(c.savDep||600000), i:+(c.savInv||1000000) };
  var total = v.e+v.d+v.i;
  openSheet('<h2>이번 달 배분</h2>'
    + '<div class="sub" style="margin-bottom:10px">합계 <b class="num">'+won(total)+'원</b>을 세 칸에 나눕니다. 투자에서 덜어 비상금이나 적금으로 옮기세요.</div>'
    + '<label class="f">비상금</label><input class="fi" id="a_e" type="number" value="'+v.e+'">'
    + '<label class="f">적금</label><input class="fi" id="a_d" type="number" value="'+v.d+'">'
    + '<label class="f">투자</label><input class="fi" id="a_i" type="number" value="'+v.i+'">'
    + '<div class="btns"><button class="btn g" id="a_r">기본값으로</button><button class="btn p" id="a_ok">적용</button></div>');
  sheetEl.querySelector('#a_r').onclick = function(){
    S.cfg.savEmg=400000; S.cfg.savDep=600000; S.cfg.savInv=1000000;
    call('saveCfg',{savEmg:400000,savDep:600000,savInv:1000000}); closeSheet(); render();
  };
  sheetEl.querySelector('#a_ok').onclick = function(){
    var o = { savEmg:+sheetEl.querySelector('#a_e').value||0,
              savDep:+sheetEl.querySelector('#a_d').value||0,
              savInv:+sheetEl.querySelector('#a_i').value||0 };
    for(var k in o) S.cfg[k]=o[k];
    call('saveCfg', o); closeSheet(); render();
  };
}

/* ---------- 저축 이체 기록 ---------- */
function saveTx(catName){
  var plan = { '비상금':+(S.cfg.savEmg||400000), '적금':+(S.cfg.savDep||600000), '투자':+(S.cfg.savInv||1000000) };
  promptVal(catName+' 이체 금액', plan[catName]||0, function(v){
    var amt = +v||0; if(!amt) return;
    var t = { id:uid(), date:todayIn(S.month), kind:'저축', amount:amt, title:catName+' 이체',
              cat:catName, pay:'cash', who:S.lastWho, memo:'', ex:true, pocket:'living' };
    S.tx.push(t); call('addTx', t); render(); toast(catName+' '+won(amt)+'원 기록됨');
  }, 'number');
}

/* =========================================================
   이벤트 바인딩
   ========================================================= */
function bindView(){
  var v = document.getElementById('view');
  v.querySelectorAll('.lr[data-id]').forEach(function(b){ b.onclick = function(){ editTx(b.dataset.id); }; });
  v.querySelectorAll('[data-lv]').forEach(function(b){ b.onclick = function(){ S.logView = b.dataset.lv; render(); }; });
  v.querySelectorAll('[data-cd]').forEach(function(b){
    b.onclick = function(){
      var d = +b.dataset.cd;
      S.calDay = (S.calDay===d ? 0 : d);
      if(S.draft) S.draft.date = defaultDate();
      render();
      if(S.draft) drawChips();
    };
  });
  v.querySelectorAll('[data-fx]').forEach(function(b){
    b.onclick = function(){ toggleFix(b.dataset.fx); };
  });
  v.querySelectorAll('[data-fxe]').forEach(function(b){ b.onclick=function(){ editFix(b.dataset.fxe); }; });
  v.querySelectorAll('[data-sav]').forEach(function(b){ b.onclick=function(){ saveTx(b.dataset.sav); }; });
  v.querySelectorAll('[data-hf]').forEach(function(b){
    b.onclick = function(){ S.half = +b.dataset.hf; render(); };
  });
  v.querySelectorAll('.lg[data-cat]').forEach(function(b){ b.onclick = function(){ openCatSheet(b.dataset.cat); }; });
  v.querySelectorAll('.item[data-pay]').forEach(function(b){ b.onclick = function(){ openPaySheet(b.dataset.pay); }; });
  var bt = v.querySelector('#bankToggle'); if(bt) bt.onclick=function(){ S.bankOpen = !S.bankOpen; render(); };
  var fd = v.querySelector('#fixDoneToggle'); if(fd) fd.onclick=function(){ S.fixDoneOpen = !S.fixDoneOpen; render(); };
  var af = v.querySelector('#addFix'); if(af) af.onclick=function(){ editFix(null); };
  var ea = v.querySelector('#editAlloc'); if(ea) ea.onclick = editAlloc;
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick = function(){ S.tab = b.dataset.tab; render(); window.scrollTo(0,0); };
});
document.getElementById('prevM').onclick = function(){ if(S.needKey) return; S.month = shiftMonth(S.month,-1); S.calDay = 0; S.half = null; load();
restoreInput(); };
document.getElementById('nextM').onclick = function(){ if(S.needKey) return; S.month = shiftMonth(S.month, 1); S.calDay = 0; S.half = null; load(); };
document.getElementById('btnCfg').onclick = openCfg;

/* =========================================================
   로드
   ========================================================= */
function load(){
  /* 앱이 꺼지는 바람에 저장이 끊긴 기록이 있으면 되살려 다시 보냅니다 */
  if(!load._restored){
    load._restored = true;
    var kept = loadPending();
    for(var k in kept){ S.pendingTx[k] = kept[k]; }
  }
  S.loading = true; render();
  var want = S.month;
  call('getState', S.month).then(function(r){
    if(want !== S.month) return;   // 그사이 달을 바꿨으면 늦게 온 응답은 버립니다
    var tx = mergeTx(r.tx, S.month);
    /* 서버가 여전히 모르는 기록은 다시 저장을 시도합니다 */
    for(var pid in S.pendingTx){
      if(!S.retrying) S.retrying = {};
      if(S.retrying[pid]) continue;
      S.retrying[pid] = 1;
      saveTxWithRetry(S.pendingTx[pid], 1);
    }
    S.cfg = r.cfg||{}; S.tx = tx; S.fix = r.fix||[]; S.learn = r.learn||{}; S.paid = r.paid||{}; S.prevPay = r.prevPay||{}; S.prevPayBank = r.prevPayBank||null; S.pocketPrior = r.pocketPrior||null; S.trend = r.trend||[]; S.yearSave = r.yearSave||null;
    S.loading = false;
    render();
  }).catch(function(e){
    if(want !== S.month) return;
    S.loading = false;
    if(S.needKey) return;          // 키 입력 화면으로 이미 넘어감
    document.getElementById('view').innerHTML = '<div class="empty"><b>데이터를 불러오지 못했습니다</b>인터넷 연결을 확인한 뒤 앱을 다시 열어 주세요.</div>';
  });
}

/* 시작 — 시트에 연결하는데 키가 없으면 먼저 묻습니다 */
if(GAS && !getKey()) askKey();
else load();

/* =========================================================
   iOS 키보드 대응
   · visualViewport로 키보드 높이를 재서 입력창을 그만큼 올림
   · 확대돼도 스크롤이 어긋나지 않게 원위치
   ========================================================= */
(function(){
  var vv = window.visualViewport;
  if(!vv) return;
  var comp = document.getElementById('composer');
  function fit(){
    var gap = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
    comp.style.transform = gap > 60 ? 'translateY(-'+gap+'px)' : '';
    if(sheetEl.classList.contains('on')){
      sheetEl.style.paddingBottom = (gap > 60 ? gap + 24 : 20) + 'px';
    }
  }
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
  inp.addEventListener('focus', function(){ setTimeout(fit, 120); });
  inp.addEventListener('blur', function(){
    comp.style.transform = '';
    window.scrollTo(0, window.scrollY);
  });
})();

/**
 * 서버가 준 목록에 아직 반영 안 된 내 기록을 얹고, 지운 건 걸러냅니다.
 * 서버 목록에 실제로 나타난 기록은 그때 보호를 풉니다 — 시간으로 어림잡지 않습니다.
 */
function mergeTx(serverTx, month){
  var have = {};
  (serverTx||[]).forEach(function(t){ have[t.id]=1; });

  /* 서버가 알아본 것은 이제 지킬 필요가 없습니다 */
  var changed = false;
  for(var id in S.pendingTx){ if(have[id]){ delete S.pendingTx[id]; changed = true; } }
  for(var d in S.deletedTx){ if(!have[d]) delete S.deletedTx[d]; }
  if(changed) savePending();

  var out = (serverTx||[]).filter(function(t){ return !S.deletedTx[t.id]; });
  for(var k in S.pendingTx){
    var pt = S.pendingTx[k];
    if(have[k]) continue;
    if(month && pt.date.indexOf(month)!==0) continue;
    out.push(pt);
  }
  return out;
}

/** 서버 응답과 화면 상태를 견주기 위한 지문 — 순서와 부가 필드는 무시합니다 */
function sig(list){
  return (list||[]).map(function(t){
    return [t.id, t.date, t.kind, t.amount, t.title, t.cat, t.pay, t.who, t.memo||'', t.ex?1:0, t.pocket||'living'].join('|');
  }).sort().join('\n');
}

/* 다른 기기에서 입력한 내용 따라잡기 — 12초마다, 그리고 앱으로 돌아올 때마다 */
var polling = false;
function poll(){
  if(!GAS || S.needKey || S.loading || polling) return;
  if(document.hidden || sheetEl.classList.contains('on') || inp.value) return;
  if(S.pending > 0) return;   // 저장이 아직 안 끝났으면 서버 값으로 덮어쓰지 않습니다
  polling = true;
  var want = S.month;
  call('getState', S.month).then(function(r){
    polling = false;
    if(!r || want !== S.month || S.pending > 0) return;
    /* 서버가 아직 모르는(하지만 이 기기가 방금 만든) 기록은 응답에 다시 얹어 지킵니다 */
    var tx = mergeTx(r.tx, S.month);
    if(sig(tx)!==sig(S.tx) || JSON.stringify(r.paid||{})!==JSON.stringify(S.paid)){
      S.tx = tx; S.paid = r.paid||{}; S.fix = r.fix||S.fix; S.cfg = r.cfg||S.cfg; S.prevPay = r.prevPay||{}; S.prevPayBank = r.prevPayBank||null; S.pocketPrior = r.pocketPrior||S.pocketPrior; S.trend = r.trend||S.trend; S.yearSave = r.yearSave||S.yearSave; render();
    }
  }).catch(function(){ polling = false; });
}
if(GAS){
  setInterval(poll, 12000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
}

/* 홈 화면 앱(PWA) — 화면 파일을 기기에 담아 빨리 열리게 합니다 */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
